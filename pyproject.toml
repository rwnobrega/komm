[project]
name = "komm"
version = "0.36.0"
description = "An open-source library for Python 3 providing tools for analysis and simulation of analog and digital communication systems."
readme = "README.md"
authors = [{ name = "Roberto W. Nobrega", email = "rwnobrega@gmail.com" }]
license = "GPL-3.0-only"
dependencies = [
    "numpy>=2.1.1",
    "tqdm>=4.67.0",
]
requires-python = ">=3.11"
urls = { home = "https://komm.dev/", repository = "https://github.com/rwnobrega/komm/" }

[project.optional-dependencies]
lint = [
    "black==26.3.1",
    "isort==8.0.1",
    "flake8==7.3.0",
    "flake8-pytest-style==2.2.0",
    "basedpyright==1.39.10",
]
test = [
    "pytest==9.0.3",
    "pytest-doctestplus==1.4.0",
    "pytest-repeat==0.9.3",
    "pytest-benchmark==5.1.0",
    "pytest-cov==6.0.0",
]
doc = [
    "griffe==2.3.2",
    "griffe-inherited-docstrings==1.1.4",
    "matplotlib==3.11.2",
    "properdocs==1.6.7",
    "mkdocs-material==9.7.7",
    "mkdocstrings==1.0.6",
    "mkdocstrings-python==2.0.9",
    "mkdocs-gen-files==0.6.1",
    "mkdocs-include-markdown-plugin==7.3.0",
    "mkdocs-literate-nav==0.6.3",
]
debug = [
    "ipykernel>=6.28.0",
    "matplotlib>=3.8.2",
    "sympy>=1.14.0",
]
all = [
    "komm[lint]",
    "komm[test]",
    "komm[doc]",
    "komm[debug]",
]

[build-system]
requires = ["build", "setuptools>=61.0.0", "wheel", "twine"]
build-backend = "setuptools.build_meta"

[tool.black]
unstable = true

[tool.isort]
profile = "black"

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
reportUnnecessaryTypeIgnoreComment = "warning"
deprecateTypingAliases = true
strict = ["src/**"]

[tool.pytest]
addopts = ["--doctest-plus", "--doctest-glob=*.md"]
python_files = ["test_*.py", "bench_*.py"]
python_functions = ["test_*", "bench_*"]
pythonpath = ["."]
testpaths = ["src/komm", "tests", "site/docs/recipes"]
