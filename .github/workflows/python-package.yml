name: Python package
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # NumPy 2.5 dropped Python 3.11
          - python-version: "3.11"
            numpy-version: "2.4.6"
          - python-version: "3.12"
            numpy-version: "2.5.2"
          - python-version: "3.13"
            numpy-version: "2.5.2"
          - python-version: "3.14"
            numpy-version: "2.5.2"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[lint,test]"
      - name: Force NumPy version for type checking
        run: pip install numpy==${{ matrix.numpy-version }}
      - name: Black
        run: black --check .
      - name: Flake8
        run: flake8 src/
      - name: Basedpyright
        run: basedpyright
      - name: pytest
        run: pytest
